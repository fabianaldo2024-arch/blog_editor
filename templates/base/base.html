<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}TechSilver{% endblock %}</title>
    
    <!-- Tailwind CSS vía CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Estilos personalizados (se pueden generar con Python después) -->
    <style>
        .tech-gradient {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }
        .silver-text {
            background: linear-gradient(90deg, #c0c0c0, #f0f0f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .hover-glow:hover {
            box-shadow: 0 0 30px rgba(192, 192, 192, 0.2);
            transform: translateY(-2px);
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="h-full tech-gradient text-white font-sans antialiased">
    
    <!-- NAVBAR -->
    <nav class="border-b border-white/10 bg-black/20 backdrop-blur-sm sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-3">
                    <span class="text-2xl font-bold silver-text">🪙 TechSilver</span>
                    <span class="text-xs text-gray-400 hidden sm:inline">Independencia Tecnológica</span>
                </div>
                <div class="flex items-center space-x-4 text-sm">
                    <a href="/" class="text-gray-300 hover:text-white transition">Blog</a>
                    <a href="/about" class="text-gray-300 hover:text-white transition">Sobre mí</a>
                    <a href="/contact" class="px-4 py-2 bg-white/10 rounded-full hover:bg-white/20 transition">Contacto</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="max-w-4xl mx-auto px-4 py-12">
        {% block content %}
        <!-- Aquí irá el contenido de cada página -->
        {% endblock %}
    </main>

    <!-- FOOTER -->
    <footer class="border-t border-white/10 mt-20 py-8 text-center text-gray-400 text-sm">
        <p>🪙 TechSilver - Independencia Tecnológica para Adultos</p>
        <p class="mt-2">
            <a href="https://linkedin.com/in/techsilver" class="hover:text-white transition">LinkedIn</a>
            &middot; 
            <a href="#" class="hover:text-white transition">Instagram</a>
            &middot;
            <a href="#" class="hover:text-white transition">YouTube</a>
        </p>
        <p class="mt-4 text-xs text-gray-600">Hecho con ❤️ y Python desde cero</p>
    </footer>

    <!-- HTMX para interactividad (opcional) -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
