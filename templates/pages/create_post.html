{% extends "base/base.html" %}

{% block title %}Crear Post - TechSilver{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white/5 backdrop-blur-sm rounded-2xl p-8 border border-white/10">
    <h1 class="text-3xl font-bold text-white text-center mb-6">✏️ Nuevo Post</h1>
    
    <form id="post-form" class="space-y-4">
        <div>
            <label for="title" class="block text-sm text-gray-300 mb-1">Título</label>
            <input type="text" id="title" name="title" required 
                   class="w-full bg-white/10 border border-white/10 rounded-lg px-4 py-2 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-400">
        </div>
        
        <div>
            <label for="content" class="block text-sm text-gray-300 mb-1">Contenido</label>
            <textarea id="content" name="content" rows="8" required 
                      class="w-full bg-white/10 border border-white/10 rounded-lg px-4 py-2 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-400"></textarea>
        </div>
        
        <button type="submit" 
                class="w-full bg-gradient-to-r from-gray-400 to-gray-200 text-black font-bold py-3 rounded-lg hover:scale-105 transition">
            Publicar
        </button>
    </form>
    
    <div id="post-message" class="mt-4 text-center text-sm"></div>
    <div class="mt-4 text-center">
        <a href="/" class="text-gray-400 hover:text-white text-sm">← Volver al inicio</a>
    </div>
</div>

<script>
document.getElementById('post-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const token = localStorage.getItem('access_token');
    if (!token) {
        document.getElementById('post-message').innerHTML = '<span class="text-red-400">❌ Debes iniciar sesión primero</span>';
        return;
    }
    
    const title = document.getElementById('title').value;
    const content = document.getElementById('content').value;
    const message = document.getElementById('post-message');
    
    try {
        const response = await fetch('/posts/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`,
            },
            body: JSON.stringify({ title, content }),
        });
        
        if (response.ok) {
            const data = await response.json();
            message.innerHTML = `<span class="text-green-400">✅ Post creado con ID: ${data.id}</span>`;
            document.getElementById('title').value = '';
            document.getElementById('content').value = '';
            setTimeout(() => window.location.href = '/', 2000);
        } else {
            const error = await response.json();
            message.innerHTML = `<span class="text-red-400">❌ ${error.detail || 'Error al crear el post'}</span>`;
        }
    } catch (error) {
        message.innerHTML = `<span class="text-red-400">❌ Error de red: ${error.message}</span>`;
    }
});
</script>
{% endblock %}
