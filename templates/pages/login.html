{% extends "base/base.html" %}

{% block title %}Iniciar Sesión - TechSilver{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-gradient-to-br from-gray-800/90 to-gray-900/90 backdrop-blur-sm rounded-2xl p-8 border border-cyan-400/30 shadow-2xl shadow-cyan-500/10">
    <h1 class="text-3xl font-bold text-center mb-6 text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 to-blue-400">
        🔐 Iniciar Sesión
    </h1>
    
    <form id="login-form" class="space-y-4">
        <div>
            <label for="username" class="block text-sm text-cyan-200/80 mb-1 font-medium">Usuario</label>
            <input type="text" id="username" name="username" required 
                   class="w-full bg-white/10 border border-cyan-500/50 rounded-lg px-4 py-2 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-cyan-400 focus:border-transparent transition">
        </div>
        
        <div>
            <label for="password" class="block text-sm text-cyan-200/80 mb-1 font-medium">Contraseña</label>
            <input type="password" id="password" name="password" required 
                   class="w-full bg-white/10 border border-cyan-500/50 rounded-lg px-4 py-2 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-cyan-400 focus:border-transparent transition">
        </div>
        
        <button type="submit" 
                class="w-full bg-gradient-to-r from-cyan-400 to-blue-500 text-white font-bold py-3 rounded-lg hover:scale-105 hover:shadow-lg hover:shadow-cyan-500/30 transition duration-200">
            Ingresar
        </button>
    </form>
    
    <div id="login-message" class="mt-4 text-center text-sm"></div>
    
    <p class="mt-6 text-center text-gray-400 text-sm">
        ¿No tienes cuenta? <a href="/register" class="text-cyan-300 hover:text-cyan-200 hover:underline font-medium transition">Regístrate</a>
    </p>
</div>

<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const message = document.getElementById('login-message');
    
    const formData = new URLSearchParams();
    formData.append('username', username);
    formData.append('password', password);
    
    try {
        const response = await fetch('/auth/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: formData.toString(),
        });
        
        if (response.ok) {
            const data = await response.json();
            localStorage.setItem('access_token', data.access_token);
            message.innerHTML = '<span class="inline-block px-4 py-2 bg-green-500/20 text-green-300 rounded-lg">✅ Sesión iniciada. Redirigiendo...</span>';
            setTimeout(() => window.location.href = '/', 1500);
        } else {
            const error = await response.json();
            message.innerHTML = `<span class="inline-block px-4 py-2 bg-red-500/20 text-red-300 rounded-lg">❌ ${error.detail || 'Error al iniciar sesión'}</span>`;
        }
    } catch (error) {
        message.innerHTML = `<span class="inline-block px-4 py-2 bg-red-500/20 text-red-300 rounded-lg">❌ Error de red: ${error.message}</span>`;
    }
});
</script>
{% endblock %}
