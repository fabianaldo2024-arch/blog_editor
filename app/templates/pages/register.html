{% extends "base/base.html" %}

{% block title %}Registro - TechSilver{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white/5 backdrop-blur-sm rounded-2xl p-8 border border-white/10">
    <h1 class="text-3xl font-bold text-white text-center mb-6">Registrarse</h1>
    
    <form id="register-form" class="space-y-4">
        <div>
            <label for="username" class="block text-sm text-gray-300 mb-1">Usuario</label>
            <input type="text" id="username" name="username" required 
                   class="w-full bg-white/10 border border-white/10 rounded-lg px-4 py-2 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-400">
        </div>
        <div>
            <label for="email" class="block text-sm text-gray-300 mb-1">Email</label>
            <input type="email" id="email" name="email" required 
                   class="w-full bg-white/10 border border-white/10 rounded-lg px-4 py-2 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-400">
        </div>
        <div>
            <label for="password" class="block text-sm text-gray-300 mb-1">Contraseña</label>
            <input type="password" id="password" name="password" required 
                   class="w-full bg-white/10 border border-white/10 rounded-lg px-4 py-2 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-400">
        </div>
        <button type="submit" 
                class="w-full bg-gradient-to-r from-gray-400 to-gray-200 text-black font-bold py-3 rounded-lg hover:scale-105 transition">
            Registrarse
        </button>
    </form>
    
    <div id="register-message" class="mt-4 text-center text-sm"></div>
    <p class="mt-6 text-center text-gray-400 text-sm">
        ¿Ya tienes cuenta? <a href="/login" class="text-white hover:underline">Inicia sesión</a>
    </p>
</div>

<script>
document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const message = document.getElementById('register-message');
    
    try {
        const response = await fetch('/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, email, password }),
        });
        
        if (response.ok) {
            message.innerHTML = '<span class="text-green-400">✅ Registro exitoso. Redirigiendo al login...</span>';
            setTimeout(() => window.location.href = '/login', 1500);
        } else {
            const error = await response.json();
            message.innerHTML = `<span class="text-red-400">❌ ${error.detail || 'Error en el registro'}</span>`;
        }
    } catch (error) {
        message.innerHTML = `<span class="text-red-400">❌ Error de red: ${error.message}</span>`;
    }
});
</script>
{% endblock %}
